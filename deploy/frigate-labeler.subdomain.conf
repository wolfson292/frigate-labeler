## SWAG proxy config: copy to /config/nginx/proxy-confs/ on the SWAG container.
## The app has no login of its own and can spend Claude credit and change Frigate+ data,
## so keep authentication ON below.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name frigate-labeler.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # Authentication (required). Authelia is on; swap for authentik or basic auth if you prefer.
    include /config/nginx/authelia-server.conf;
    #include /config/nginx/authentik-server.conf;
    #auth_basic "Restricted";
    #auth_basic_user_file /config/nginx/.htpasswd;

    location / {
        include /config/nginx/authelia-location.conf;
        #include /config/nginx/authentik-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app frigate-labeler;
        set $upstream_port 5178;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Claude revisions can take a minute or two.
        proxy_read_timeout 300s;
    }
}
