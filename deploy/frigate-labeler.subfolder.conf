## SWAG proxy config, serving the app at https://<your-domain>/frigate-labeler/
## Copy to /config/nginx/proxy-confs/ in the SWAG container, and set
## FRIGATE_LABELER_BASE_PATH=/frigate-labeler on the app (the compose file does).
##
## Keep authentication ON: the app has no login of its own, and anyone who can reach it can
## spend Claude credit and change Frigate+ data.

location /frigate-labeler {
    return 301 $scheme://$host/frigate-labeler/;
}

location ^~ /frigate-labeler/ {
    include /config/nginx/authelia-location.conf;
    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;
    set $upstream_app frigate-labeler;
    set $upstream_port 5178;
    set $upstream_proto http;
    proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    # Claude revisions can take a minute or two.
    proxy_read_timeout 300s;
}
